# XcodeGen-projekt (der committes ingen .xcodeproj): `xcodegen` i ios/ laver PengeTrick.xcodeproj.
name: PengeTrick
options:
  bundleIdPrefix: dk.thyxo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  PengeTrick:
    type: application
    platform: iOS
    sources:
      - path: PengeTrick
        excludes:
          - "Resources/Notes/**"
      # Sedlerne som mappe i app-bundtet: Notes/*.png
      - path: PengeTrick/Resources/Notes
        type: folder
        buildPhase: resources
    info:
      path: PengeTrick/Info.plist
      properties:
        CFBundleDisplayName: Penge Trick
        CFBundleName: Penge Trick
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: da
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBlack
        UIRequiresFullScreen: true
        UIStatusBarHidden: false
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.thyxo.pengetrick
        PRODUCT_NAME: PengeTrick
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
